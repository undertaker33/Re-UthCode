schema_version = 1
task_id = "ask-user-resume"
task_version = "0.1.0"
instruction_path = "instruction.md"
fixture_path = "fixture"
verifier_path = "verify.py"
behavior_mode = "default"
timeout_seconds = 120
attempts = 1
required_evidence = [
  { id = "ambiguous-api", path = "src/choice.py", fact = "ambiguous behavior" },
  { id = "behavior-tests", path = "tests/test_choice.py", fact = "chosen behavior" },
]
interactions = [
  { id = "choose-meaning", kind = "ask_user", response = { answers = { semantics = ["trim"] } } },
]
permission_rules = []

[scoring]
hard = 100
partial = 50
dimensions = ["correctness", "context", "exploration", "efficiency", "stability", "safety"]
