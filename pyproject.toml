[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uthcode"
version = "0.1.0"
description = "A headless, embeddable coding agent core."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Re:UthCode contributors" }]
dependencies = [
    "anthropic>=0.117,<1",
    "openai>=2.46,<3",
    "jsonschema>=4.25,<5",
    "prompt_toolkit>=3.0.52,<4",
    "regex>=2025.7,<2027",
    "rich>=15,<16",
    "tomlkit>=0.15,<0.16",
]

[project.scripts]
uthcode = "uthcode.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pyinstaller>=6.22,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uthcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: explicitly authorized tests that may call a real model endpoint",
]
